name: HIL CI

on:
  # No cron: HIL_ci/watch_registry.py (running on the bench PC) detects new commits.
  # This workflow now only runs manually or via repository_dispatch.
  repository_dispatch:       # sent by a registered user repo right after a push
    types: [hil-push]
  workflow_dispatch:
    inputs:
      only:
        description: "Registry name to force-run (optional)"
        required: false
      ref:
        description: "Branch or commit SHA for that repo (optional)"
        required: false

# One physical bench: never run two jobs at once, never cancel a running one.
concurrency:
  group: hil-bench
  cancel-in-progress: false

jobs:
  hil:
    # The bench PC (Linux or Windows) registers its runner with the label "hil".
    runs-on: [self-hosted, hil]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install -r HIL_ci/requirements.txt

      - name: Poll registry and run HIL tests (Windows)
        if: runner.os == 'Windows'
        env:
          ONLY: ${{ github.event.inputs.only }}
          REF: ${{ github.event.inputs.ref }}
        shell: powershell
        run: |
          $a = @()
          if ($env:ONLY) { $a += @("--only", $env:ONLY) }
          if ($env:REF)  { $a += @("--ref", $env:REF) }
          python HIL_ci/poll_registry.py @a

      # Linux: the bench settings (serial ports, tool paths, data dir) come from the same
      # env file as the watcher service, and Python from the venv made by setup_linux.sh.
      - name: Poll registry and run HIL tests (Linux)
        if: runner.os == 'Linux'
        env:
          ONLY: ${{ github.event.inputs.only }}
          REF: ${{ github.event.inputs.ref }}
        shell: bash
        run: |
          set -a; . "$HOME/.config/hil-ci/hil-ci.env"; set +a
          args=()
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          [ -n "$REF" ]  && args+=(--ref "$REF")
          "$HIL_VENV/bin/python" -m pip install -q -r HIL_ci/requirements.txt
          "$HIL_VENV/bin/python" HIL_ci/poll_registry.py "${args[@]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hil-results-${{ github.run_id }}
          path: hil_artifacts/**
          if-no-files-found: ignore
